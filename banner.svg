<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Nikolay Krutykh — Python Backend &amp; AI/ML Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#0A161A"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal" cx="84%" cy="76%" r="46%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.02em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 500; fill: #CBD5E1; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .node-label { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #E2E8F0; }
    .node-sub { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10.5px; fill: #94A3B8; }

    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; transform-origin: 76px 54px; }
    .scan { animation: sweep 7s linear infinite; }
    .flow-1 { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    .flow-2 { stroke-dasharray: 6 8; animation: dash 2.2s linear infinite; }
    .fade-in-1 { animation: fadeUp 0.9s ease-out both; }
    .fade-in-2 { animation: fadeUp 1.1s ease-out both; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes sweep { 0% { transform: translateX(-260px); } 100% { transform: translateX(1320px); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowBlue)"/>
    <rect width="1200" height="320" fill="url(#glowTeal)"/>

    <!-- Animated scanning light beam -->
    <rect class="scan" x="0" y="0" width="220" height="320" fill="url(#scanBeam)"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>

    <!-- Outer subtle border -->
    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="16" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>

    <!-- LEFT SIDE: Identity & Terminal -->
    <!-- Status pill -->
    <rect x="56" y="40" width="328" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle class="pulse-dot" cx="76" cy="54" r="4.5" fill="#10B981"/>
    <text x="90" y="58.5" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="0.06em">OPEN TO WORK · ROSTOV-ON-DON / REMOTE</text>

    <!-- Name -->
    <text x="56" y="132" class="title fade-in-1" font-size="52">Nikolay Krutykh</text>

    <!-- Role subtitle -->
    <text x="56" y="172" class="subtitle fade-in-2" font-size="21">Python Backend Developer  <tspan fill="#14B8A6">·</tspan>  Junior ML / AI Engineer</text>

    <!-- Terminal line -->
    <rect x="56" y="206" width="545" height="44" rx="8" fill="#060A12" stroke="#1E293B" stroke-width="1.2"/>
    <text x="74" y="233" class="mono" font-size="14" fill="#14B8A6">$</text>
    <text x="92" y="233" class="mono" font-size="13.5" fill="#E2E8F0">uvicorn app:main --stack fastapi,postgres,redis,rag</text>
    <rect class="cursor" x="526" y="219" width="8" height="17" rx="1.5" fill="#3B82F6"/>

    <!-- Footnote tags -->
    <text x="56" y="282" class="mono" font-size="12" fill="#64748B">@TaCeiN  ·  VK Education × MAX Finalist  ·  RGUPS '28</text>

    <!-- RIGHT SIDE: Animated System Architecture Diagram -->
    <!-- Container frame -->
    <rect x="652" y="38" width="492" height="244" rx="12" fill="#070B14" fill-opacity="0.72" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="672" cy="56" r="4" fill="#334155"/>
    <circle cx="686" cy="56" r="4" fill="#334155"/>
    <circle cx="700" cy="56" r="4" fill="#334155"/>
    <text x="718" y="60" class="mono" font-size="11" fill="#64748B">architecture.pipeline</text>
    <line x1="652" y1="72" x2="1144" y2="72" stroke="#1E293B" stroke-width="1"/>

    <!-- Animated connector paths -->
    <path class="flow-1" d="M 808 134 L 862 134" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <path class="flow-1" d="M 986 134 L 1018 134" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <path class="flow-2" d="M 808 224 L 862 224" fill="none" stroke="#14B8A6" stroke-width="2"/>
    <path class="flow-2" d="M 986 224 L 1018 224" fill="none" stroke="#14B8A6" stroke-width="2"/>
    <path class="flow-2" d="M 742 162 L 742 196" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- Row 1: Backend Pipeline -->
    <rect x="676" y="106" width="132" height="56" rx="8" fill="#0F172A" stroke="#2563EB" stroke-opacity="0.75" stroke-width="1.3"/>
    <text x="742" y="130" text-anchor="middle" class="node-label">FastAPI</text>
    <text x="742" y="148" text-anchor="middle" class="node-sub">REST · WS · JWT</text>

    <rect x="862" y="106" width="124" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="924" y="130" text-anchor="middle" class="node-label">PostgreSQL</text>
    <text x="924" y="148" text-anchor="middle" class="node-sub">SQLAlchemy · Redis</text>

    <rect x="1018" y="106" width="104" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="1070" y="130" text-anchor="middle" class="node-label">Docker</text>
    <text x="1070" y="148" text-anchor="middle" class="node-sub">Nginx · CI/CD</text>

    <!-- Row 2: AI / RAG Pipeline -->
    <rect x="676" y="196" width="132" height="56" rx="8" fill="#0F172A" stroke="#14B8A6" stroke-opacity="0.75" stroke-width="1.3"/>
    <text x="742" y="220" text-anchor="middle" class="node-label">Hybrid RAG</text>
    <text x="742" y="238" text-anchor="middle" class="node-sub">FAISS + BM25</text>

    <rect x="862" y="196" width="124" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="924" y="220" text-anchor="middle" class="node-label">Reranker</text>
    <text x="924" y="238" text-anchor="middle" class="node-sub">Cross-Encoder</text>

    <rect x="1018" y="196" width="104" height="56" rx="8" fill="#0F172A" stroke="#14B8A6" stroke-opacity="0.75" stroke-width="1.3"/>
    <text x="1070" y="220" text-anchor="middle" class="node-label">Local LLM</text>
    <text x="1070" y="238" text-anchor="middle" class="node-sub">Ollama · LoRA</text>
  </g>
</svg>
